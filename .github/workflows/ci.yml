name: MLOps CI Pipeline
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  build-and-lint:
    name: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install flake8 pytest pytest-cov
      - name: Compile Python files
        run: python -m compileall -q src tests
      - name: Lint source code
        run: |
          python -m flake8 src/ \
            --max-line-length=100 \
            --extend-ignore=E203 \
            --statistics
  test-suite:
    name: test-suite
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov
      - name: Create data directories
        run: mkdir -p data/raw data/processed
      - name: Collect Iris data
        run: |
          python src/pipeline/collect.py \
            --output data/raw/iris_raw.csv
      - name: Preprocess Iris data
        run: |
          python src/pipeline/preprocess.py \
            --input data/raw/iris_raw.csv \
            --output data/processed/iris_preprocessed.csv
      - name: Engineer features
        run: |
          python src/pipeline/features.py \
            --input data/processed/iris_preprocessed.csv \
            --output data/processed/iris_features.csv
      - name: Run complete test suite
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --junitxml=test-results.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: warn
  model-quality-gate:
    name: model-quality-gate
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Create data directories
        run: mkdir -p data/raw data/processed
      - name: Collect Iris data
        run: |
          python src/pipeline/collect.py \
            --output data/raw/iris_raw.csv
      - name: Preprocess Iris data
        run: |
          python src/pipeline/preprocess.py \
            --input data/raw/iris_raw.csv \
            --output data/processed/iris_preprocessed.csv
      - name: Engineer features
        run: |
          python src/pipeline/features.py \
            --input data/processed/iris_preprocessed.csv \
            --output data/processed/iris_features.csv
      - name: Validate model quality
        run: python -m pytest tests/test_model_quality.py -v
